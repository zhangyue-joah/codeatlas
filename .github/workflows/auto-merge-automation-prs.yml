name: Auto Merge Automation PRs

on:
  workflow_run:
    workflows:
      - CI
    types:
      - completed

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-automation-prs
  cancel-in-progress: false

jobs:
  auto-merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Auto-merge automation PRs when CI passes
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // CI 运行在哪个分支
            const headBranch = run.head_branch;
            const headSha = run.head_sha;
            core.info(`CI succeeded on branch ${headBranch} at ${headSha}`);

            if (!headBranch) {
              core.info('No head branch found on workflow_run; skipping.');
              return;
            }

            // 查找这个分支对应的开放 PR
            const { data: prs } = await github.rest.pulls.list({
              owner,
              repo,
              state: 'open',
              head: `${owner}:${headBranch}`,
            });

            if (!prs.length) {
              core.info('No open PRs for this branch; nothing to merge.');
              return;
            }

            for (const pr of prs) {
              core.info(`Considering PR #${pr.number} (${pr.title})`);

              if (pr.base.ref !== 'main') {
                core.info(`- Skip: base branch is ${pr.base.ref}, not main.`);
                continue;
              }

              if (pr.draft) {
                core.info('- Skip: PR is draft.');
                continue;
              }

              const hasAutomationLabel = pr.labels.some((label) => label.name === 'automation');
              if (!hasAutomationLabel) {
                core.info('- Skip: PR has no automation label.');
                continue;
              }

              if (pr.head.sha !== headSha) {
                core.info(`- Skip: PR head SHA ${pr.head.sha} does not match CI SHA ${headSha}.`);
                continue;
              }

              // 再取一次 PR 详情，确保 mergeable 状态
              const { data: prDetail } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pr.number,
              });

              if (prDetail.mergeable === false) {
                core.info('- Skip: PR is not mergeable (mergeable=false).');
                continue;
              }

              try {
                core.info(`- Merging PR #${pr.number} via squash...`);
                await github.rest.pulls.merge({
                  owner,
                  repo,
                  pull_number: pr.number,
                  merge_method: 'squash',
                });
                core.info(`- Successfully merged PR #${pr.number}.`);
              } catch (error) {
                core.warning(`- Failed to merge PR #${pr.number}: ${error.message}`);
              }
            }
