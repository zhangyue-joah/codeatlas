name: Weekly Content Scoreboard

on:
  schedule:
    # UTC 时间：每周一 01:30 运行（北京时区约为 09:30）
    - cron: '30 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-content-scoreboard
  cancel-in-progress: false

jobs:
  content-scoreboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Generate content scoreboard
        run: npm run content:scoreboard

      - name: Upload scoreboard artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: content-scoreboard
          path: |
            docs/content-scoreboard.md
            docs/content-scoreboard.json
          if-no-files-found: ignore

      - name: Create or update weekly content plan issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "[Content] 本周导航与内容迭代计划";

            let bodyMd = "";
            if (fs.existsSync("docs/content-scoreboard.md")) {
              bodyMd = fs.readFileSync("docs/content-scoreboard.md", "utf8");
            } else {
              bodyMd = "content-scoreboard.md 未生成，请检查 scripts/content-scoreboard.mjs。";
            }

            const now = new Date().toISOString();
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const body = [
              `> 自动生成于 ${now}`,
              `> 工作流: ${context.workflow}`,
              `> 运行链接: ${runUrl}`,
              "",
              bodyMd
            ].join("\n");

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100,
            });

            const existing = issues.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                body,
              });
              core.info(`已更新内容迭代计划 Issue #${existing.number}`);
            } else {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
              });
              core.info(`已创建内容迭代计划 Issue #${created.data.number}`);
            }
