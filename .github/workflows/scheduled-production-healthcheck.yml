name: Scheduled Production Healthcheck

on:
  schedule:
    # UTC 时间，每 6 小时巡检一次
    - cron: '15 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: scheduled-production-healthcheck
  cancel-in-progress: false

jobs:
  healthcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve base URL
        env:
          VAR_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}
        run: |
          if [ -z "$VAR_BASE_URL" ]; then
            echo "PRODUCTION_BASE_URL 未配置，无法执行生产巡检。"
            exit 1
          fi
          echo "BASE_URL=$VAR_BASE_URL" >> "$GITHUB_ENV"

      - name: Run scheduled healthcheck
        id: healthcheck
        continue-on-error: true
        env:
          HEALTHCHECK_TIMEOUT_MS: '10000'
          HEALTHCHECK_MAX_LATENCY_MS: '4000'
          HEALTHCHECK_RETRIES: '4'
          HEALTHCHECK_RETRY_DELAY_MS: '8000'
          HEALTHCHECK_PATHS: '/,/robots.txt,/sitemap.xml'
          HEALTHCHECK_OUTPUT_FILE: 'healthcheck-report.json'
        run: node scripts/post-deploy-healthcheck.mjs

      - name: Upload healthcheck report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scheduled-healthcheck-report
          path: healthcheck-report.json
          if-no-files-found: ignore

      - name: Create or update alert issue when failed
        if: steps.healthcheck.outcome == 'failure'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const title = "生产健康检查失败（自动告警）";
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const now = new Date().toISOString();
            let detailLines = ["- 巡检报告: 未找到 healthcheck-report.json"];

            if (fs.existsSync("healthcheck-report.json")) {
              const report = JSON.parse(fs.readFileSync("healthcheck-report.json", "utf8"));
              const failed = (report.results || []).filter((item) => !item.ok);
              detailLines = [
                `- 目标地址: ${report.baseUrl || "unknown"}`,
                `- 检查结果: ${report.summary?.failed || failed.length}/${report.summary?.total || (report.results || []).length} 失败`,
                `- 检查时间: ${report.checkedAt || now}`
              ];

              if (failed.length > 0) {
                detailLines.push("- 失败明细:");
                for (const item of failed.slice(0, 10)) {
                  detailLines.push(
                    `  - ${item.path} status=${item.status ?? "ERR"} latency=${item.latencyMs}ms attempt=${item.attempt} reason=${item.reason || "unknown"}`
                  );
                }
              }
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: "open",
              per_page: 100
            });

            const existing = issues.find((issue) => issue.title === title);
            const body = [
              "检测到生产健康检查失败，请尽快排查。",
              "",
              `- 时间: ${now}`,
              `- 工作流: ${context.workflow}`,
              `- 运行链接: ${runUrl}`,
              `- 分支: ${context.ref}`,
              ...detailLines
            ].join("\n");

            if (existing) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: existing.number,
                body
              });
              core.info(`已追加告警到现有 Issue #${existing.number}`);
              return;
            }

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body
            });
            core.info(`已创建告警 Issue #${created.data.number}`);

      - name: Fail workflow when healthcheck failed
        if: steps.healthcheck.outcome == 'failure'
        run: exit 1
